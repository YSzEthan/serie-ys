[color.graph]
# 各分支依序輪流套用的顏色。
branches = [
  "#E06C76",
  "#98C379",
  "#E5C07B",
  "#61AFEF",
  "#C678DD",
  "#56B6C2",
]

[keybind]
# 快捷鍵覆蓋，詳見「自訂快捷鍵」文件；預設鍵位見
# https://github.com/YSzEthan/serie-ys/blob/main/assets/default-keybind.toml
# 設定某個 action 會完全取代它的預設鍵位（不是追加），例：
# navigate_down = ["ctrl-n"]
