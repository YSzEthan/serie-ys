# ── 狀態（GitHub API 值 OPEN/CLOSED/MERGED 與過濾）──

[github.state.open]
zh-TW = "開啟"
en-US = "Open"

[github.state.closed]
zh-TW = "已關閉"
en-US = "Closed"

[github.state.merged]
zh-TW = "已 merge"
en-US = "Merged"

[github.state.draft]
zh-TW = "draft"
en-US = "draft"

[github.state.all]
zh-TW = "全部"
en-US = "All"

# ── 錯誤訊息（夾帶 gh/git 的原文用 detail 帶入，不翻）──

[github.error.gh_failed]
zh-TW = "gh 指令失敗：%{detail}"
