name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  # 只取消 PR 上被新 push 取代的舊 run；main 的每個 commit 都要有完整的結果。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.get-msrv.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7
      - name: Get MSRV
        id: get-msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | cut -d '"' -f 2)
          echo "msrv=$MSRV" >> $GITHUB_OUTPUT

  # 發版腳本的邏輯（版號等級、subject 格式、CHANGELOG 區塊）決定了本機發版
  # 算出什麼，跟 Rust 那邊無關，所以獨立成一個 job，不用等 toolchain 裝完。
  release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release script
        run: python3 .github/scripts/test_prepare_release.py

  lint:
    needs: prepare
    strategy:
      matrix:
        versions:
          - stable
          - ${{ needs.prepare.outputs.msrv }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.versions }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: |
          rustc --version
          cargo --version
          cargo fmt -- --version
          cargo clippy -- --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --verbose
