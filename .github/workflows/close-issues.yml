name: Close Issues

# PR merge 進 `dev` 時，GitHub 不會依 `Closes #N` 自動關 issue（只認預設 branch
# `main`），所以由這支 workflow 補上。關鍵字沿用 GitHub 的清單，大小寫不拘，
# 一個 PR 可以寫多個。
on:
  pull_request:
    types: [closed]
    branches:
      - dev

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # body 與 title 走 env，避免被當成 shell 程式碼執行
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+#[0-9]+' \
            | grep -oE '[0-9]+$' \
            | sort -un \
            | while read -r n; do
                # 只關 issue；若 #N 其實是 PR，gh issue close 也會關掉，所以先確認型別
                if gh api "repos/$GH_REPO/issues/$n" --jq '.pull_request // empty' | grep -q .; then
                  echo "#$n 是 PR，略過"
                  continue
                fi
                gh issue close "$n" --reason completed \
                  --comment "由 #$PR_NUMBER merge 進 dev 自動關閉。" || true
              done
