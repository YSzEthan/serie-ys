name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/build.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version and update CHANGELOG
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0)
          python3 .github/scripts/prepare_release.py --from "$LAST_TAG"

      - name: Commit and tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cargo metadata --offline --format-version 1 > /dev/null  # 讓 Cargo.lock 版號跟上
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        t:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bin_ext: ""
            label: macos-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            bin_ext: ""
            label: macos-x64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bin_ext: ""
            label: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bin_ext: ".exe"
            label: windows
    runs-on: ${{ matrix.t.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Setup rust target
        run: rustup target add ${{ matrix.t.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.t.target }}
      - name: Build
        uses: houseabsolute/actions-rust-cross@v1.0.0
        with:
          command: build
          target: ${{ matrix.t.target }}
          args: "--release"
      - name: Stage
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.tag }}"
          VER="${VER#v}"
          ASSET="ysgit_${VER}-${{ matrix.t.label }}${{ matrix.t.bin_ext }}"
          cp "target/${{ matrix.t.target }}/release/ysgit${{ matrix.t.bin_ext }}" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.t.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  upload:
    needs: [prepare, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: release-*
          merge-multiple: true
      - name: Checksum
        run: cd releases && sha256sum * > checksum.txt
      - uses: softprops/action-gh-release@v2.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: releases/*
          make_latest: true
