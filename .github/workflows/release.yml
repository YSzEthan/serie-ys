name: Release

# 只有推 `vX.Y.Z` tag 才 build 與發版。版號、CHANGELOG 由維護者在本機跑
# `.github/scripts/prepare_release.py` 產生，經 PR 進 main 後再把 tag 打在
# merge commit 上；CI 不自動算版號，也不 commit 回 main。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/build.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 與 Cargo.toml 版號 v$CARGO_VERSION 不一致"
            exit 1
          fi

      # 與 upload job 取 Release body 用同一條規則，缺區塊就在這裡擋下，
      # 不要等 build 完才發現沒有說明文字。
      - name: CHANGELOG has this version
        run: python3 .github/scripts/prepare_release.py --print-section "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 指向的 commit 不在 main 上"
            exit 1
          fi

  build:
    needs: [test, verify]
    strategy:
      fail-fast: false
      matrix:
        t:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bin_ext: ""
            label: macos-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            bin_ext: ""
            label: macos-x64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bin_ext: ""
            label: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bin_ext: ".exe"
            label: windows
    runs-on: ${{ matrix.t.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust target
        run: rustup target add ${{ matrix.t.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.t.target }}
      - name: Build
        uses: houseabsolute/actions-rust-cross@v1.0.0
        with:
          command: build
          target: ${{ matrix.t.target }}
          args: "--release"
      - name: Stage
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ASSET="ysgit_${VER}-${{ matrix.t.label }}${{ matrix.t.bin_ext }}"
          cp "target/${{ matrix.t.target }}/release/ysgit${{ matrix.t.bin_ext }}" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.t.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  upload:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 .github/scripts/prepare_release.py --print-section "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: release-*
          merge-multiple: true
      - name: Checksum
        run: cd releases && sha256sum * > checksum.txt
      - uses: softprops/action-gh-release@v2.0.4
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: releases/*
          make_latest: true
