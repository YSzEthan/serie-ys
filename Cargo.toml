[package]
name = "ysgit"
version = "4.17.0"
description = "Git Graph in Terminal"
authors = ["YSEthan"]
homepage = "https://github.com/YSzEthan/serie-ys"
repository = "https://github.com/YSzEthan/serie-ys"
readme = "README.md"
license = "MIT"
keywords = ["git", "cli", "tui", "terminal"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.89.0"

# `/docs` 整個排掉會讓打包出來的 crate 編不動測試：`src/config.rs` 用
# `include_str!` 讀 docs/src/configurations/config-file-format.md。只排掉
# 擷取出來的畫面（唯一佔空間的部分），文字檔留著。
exclude = ["/.github", "/scripts", "/docs/src/img"]

[[bin]]
name = "ysgit"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.8", features = ["derive"] }
console = "0.16.3"
emojis = "0.9.0"
fuzzy-matcher = "0.3.7"
garde = { version = "0.23.0", features = ["derive", "regex"] }
jiff = "1.0.1"
laurier = "0.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "serde", "unstable-rendered-line-info"] }
rustc-hash = "2.1.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }
smart-default = "0.7.1"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }
toml_edit = "0.25.17"
tui-input = { version = "0.15.1", default-features = false, features = ["crossterm"] }
notify = { version = "8.2.0", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.7.0"
umbra = "0.6.0"
unicode-width = "0.2"
rust-i18n = "4"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
