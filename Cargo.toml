[package]
name = "serie"
version = "2.0.0"
description = "A rich git commit graph in your terminal, like magic"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>"]
homepage = "https://github.com/lusingander/serie"
repository = "https://github.com/lusingander/serie"
readme = "README.md"
license = "MIT"
keywords = ["git", "cli", "tui", "terminal"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.88.0"

# `/docs` 整個排掉會讓打包出來的 crate 編不動測試：`src/config.rs` 用
# `include_str!` 讀 docs/src/configurations/config-file-format.md。只排掉
# 擷取出來的畫面（唯一佔空間的部分），文字檔留著。
exclude = ["/.github", "/scripts", "/docs/src/img"]

[[bin]]
name = "ysgit"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
console = "0.16.3"
emojis = "0.9.0"
fuzzy-matcher = "0.3.7"
garde = { version = "0.22.1", features = ["derive", "regex"] }
laurier = "0.3.0"
ratatui = { version = "0.30.0", features = ["serde", "unstable-rendered-line-info"] }
rustc-hash = "2.1.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }
smart-default = "0.7.1"
toml = "1.1.2"
tui-input = "0.15.1"
tui-tree-widget = "0.24.0"
notify = { version = "7.0.0", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5.0"
umbra = "0.4.0"
unicode-width = "0.2"

[dev-dependencies]
dircpy = "0.3.20"
rstest = "0.26.1"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
